# The "commercial VPN exit" hop. It forwards, and appends the peer it saw - the
# correct behaviour for a proxy, and exactly why the LEFTMOST value is a lie while
# the rightmost appended one is the truth of that hop.
worker_processes 1;
error_log out/relay_error.log warn;
pid out/nginx_relay.pid;
events { worker_connections 256; }
http {
  access_log out/relay_access.log combined;
  log_format xffchain '$remote_addr - [$time_local] "$request" $status "$http_x_forwarded_for"';
  access_log out/relay_xffchain.log xffchain;
  server {
    listen 127.0.0.1:8081;
    server_name relay-vpn-exit.lab;
    location / {
      proxy_pass http://172.30.0.20:8085;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $host;
    }
  }
}
