# In-container version: both edges on the same nginx, different listen ports.
# (The bind addresses above are for running on a host; in Docker, drop 127.0.0.1.)
map $http_x_forwarded_for $naive_xff { default $http_x_forwarded_for; }
server {
  listen 8080;
  location / { proxy_pass http://relay:8085; proxy_set_header X-Forwarded-For $naive_xff; }
}
server {
  listen 8088;
  set_real_ip_from 172.30.0.0/24;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  location / { proxy_pass http://relay:8085; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
}
