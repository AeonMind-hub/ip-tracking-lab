# LAB ONLY - the bug that ruins incident timelines.
worker_processes 1;
error_log out/nginx_edge_naive_error.log warn;
pid out/nginx_edge_naive.pid;
events { worker_connections 256; }
http {
  # The second bug, independent of proxy_set_header: the *log's* client field is the
  # header the client typed. `proxy_set_header X-Forwarded-For $http_x_forwarded_for`
  # can be fixed tomorrow and this line still rewrites history in your SIEM.
  log_format naive '$http_x_forwarded_for - $remote_addr [$time_local] '
                   '"$request" $status $body_bytes_sent "$http_user_agent"';
  access_log out/edge_naive_access.log naive;
  server {
    listen 127.0.0.1:8080;
    server_name edge-naive.lab;
    # NO real_ip_header / set_real_ip_from here: $remote_addr to the app is *this*
    # proxy, and the line below forwards the client's header verbatim -> spoofable.
    location / {
      proxy_pass http://127.0.0.1:8085;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;   # <-- THE BUG
      proxy_set_header X-Real-IP $http_x_real_ip;               # <-- ALSO a bug
    }
  }
}
