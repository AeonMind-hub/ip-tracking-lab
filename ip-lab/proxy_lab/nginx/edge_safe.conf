# The correct version, side by side, on another port, so you can diff behaviour
# instead of trusting an explanation.
worker_processes 1;
error_log out/nginx_edge_safe_error.log warn;
pid out/nginx_edge_safe.pid;
events { worker_connections 256; }
http {
  # field 1 stays $remote_addr (the verified value after real_ip), and the *raw claims*
  # are logged beside it, so "what was said" and "what was believed" are both in evidence.
  log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" rid=$request_id '
                  'xff="$http_x_forwarded_for" tcip="$http_true_client_ip" '
                  'cf="$http_cf_connecting_ip"';
  access_log out/edge_access.log main;
  # Only these ranges may *tell* me who the client was.
  set_real_ip_from 127.0.0.0/8;
  real_ip_header   X-Forwarded-For;
  real_ip_recursive on;
  server {
    listen 127.0.0.1:8088;
    server_name edge-safe.lab;
    location / {
      proxy_pass http://127.0.0.1:8081;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # appends, never trusts
      proxy_set_header X-Real-IP $remote_addr;
      proxy_hide_header X-Backend-IP;      # strip the origin's leaks on the way out
      proxy_hide_header X-Debug-Trace;
      proxy_hide_header X-Powered-By;
      proxy_set_header X-Forwarded-Host "";   # cache-poisoning / reset-poisoning hygiene
    }
  }
}
